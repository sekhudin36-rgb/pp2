<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d3d94"/>
      <stop offset="50%" stop-color="#162f75"/>
      <stop offset="100%" stop-color="#0e1f52"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="50%" stop-color="#ff3d00"/>
      <stop offset="100%" stop-color="#d50000"/>
    </linearGradient>
    <path id="textArcTop" d="M 100,205 A 165,165 0 0,1 400,205" fill="none"/>
    <path id="textArcBottom" d="M 115,395 Q 250,470 385,395" fill="none"/>
  </defs>

  <!-- Outer Flower Petal Outline (5 Lobes) -->
  <g filter="url(#glow)">
    <!-- Blue Shield Body with Yellow Borders -->
    <!-- Custom 5-petaled flower shield path matching SMP Negeri 3 Kras emblem -->
    <path d="
      M 250,18
      C 278,18 322,46 348,72
      C 376,56 422,76 438,110
      C 458,152 446,196 428,228
      C 466,260 488,310 472,362
      C 456,412 402,446 352,434
      C 328,468 286,488 250,488
      C 214,488 172,468 148,434
      C 98,446 44,412 28,362
      C 12,310 34,260 72,228
      C 54,196 42,152 62,110
      C 78,76 124,56 152,72
      C 178,46 222,18 250,18 Z
    " fill="#ffd600" stroke="#162f75" stroke-width="4"/>

    <path d="
      M 250,28
      C 274,28 314,54 338,78
      C 364,64 406,82 420,114
      C 438,152 426,190 410,220
      C 446,250 464,296 450,344
      C 436,390 388,422 342,410
      C 320,442 282,462 250,462
      C 218,462 180,442 158,410
      C 112,422 64,390 50,344
      C 36,296 54,250 90,220
      C 74,190 62,152 80,114
      C 94,82 136,64 162,78
      C 186,54 226,28 250,28 Z
    " fill="#1b3a88" stroke="#ffd600" stroke-width="7"/>
  </g>

  <!-- Golden 5-pointed Star at Top -->
  <g transform="translate(250, 75)">
    <polygon points="0,-25 7,-7 26,-7 11,4 17,23 0,11 -17,23 -11,4 -26,-7 -7,-7"
             fill="url(#goldGrad)" stroke="#b26a00" stroke-width="1.5"/>
  </g>

  <!-- Arc Text: SMP NEGERI 3 KRAS -->
  <text font-family="'Arial Black', 'Impact', 'Segoe UI', sans-serif" font-weight="900" font-size="27" fill="#ffd600" stroke="#0f1d42" stroke-width="1.2" letter-spacing="2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      SMP NEGERI 3 KRAS
    </textPath>
  </text>

  <!-- Center Winged Torch & Pen Emblem -->
  <g id="wings-left" fill="url(#goldGrad)" stroke="#9e6000" stroke-width="1.5">
    <!-- Left Wing Feathers sweeping upward -->
    <path d="M 230,320 C 190,300 130,240 105,160 C 125,200 160,250 220,300 Z" />
    <path d="M 225,325 C 180,310 120,265 95,190 C 120,230 155,275 215,315 Z" />
    <path d="M 220,335 C 170,325 115,290 95,225 C 120,260 160,300 210,330 Z" />
    <path d="M 215,345 C 170,340 120,320 105,265 C 130,295 170,325 210,342 Z" />
    <path d="M 210,355 C 175,355 135,345 125,305 C 145,330 180,348 208,354 Z" />
    <path d="M 205,365 C 180,365 150,360 145,340 C 160,355 185,362 205,365 Z" />
  </g>

  <g id="wings-right" fill="url(#goldGrad)" stroke="#9e6000" stroke-width="1.5">
    <!-- Right Wing Feathers sweeping upward (mirror) -->
    <path d="M 270,320 C 310,300 370,240 395,160 C 375,200 340,250 280,300 Z" />
    <path d="M 275,325 C 320,310 380,265 405,190 C 380,230 345,275 285,315 Z" />
    <path d="M 280,335 C 330,325 385,290 405,225 C 380,260 340,300 290,330 Z" />
    <path d="M 285,345 C 330,340 380,320 395,265 C 370,295 330,325 290,342 Z" />
    <path d="M 290,355 C 325,355 365,345 375,305 C 355,330 320,348 292,354 Z" />
    <path d="M 295,365 C 320,365 350,360 355,340 C 340,355 315,362 295,365 Z" />
  </g>

  <!-- Golden Wing Shield Brackets (Inner Accents) -->
  <path d="M 226,305 C 205,270 185,210 185,185 C 205,225 220,260 236,290 Z" fill="url(#goldGrad)" stroke="#9e6000" stroke-width="1.5"/>
  <path d="M 274,305 C 295,270 315,210 315,185 C 295,225 280,260 264,290 Z" fill="url(#goldGrad)" stroke="#9e6000" stroke-width="1.5"/>

  <!-- Center Torch & Pen Nib Column -->
  <g>
    <!-- Upper Pen / Torch Holder -->
    <path d="M 242,215 L 258,215 L 256,295 L 244,295 Z" fill="url(#goldGrad)" stroke="#8a5200" stroke-width="1.5"/>
    <line x1="250" y1="220" x2="250" y2="290" stroke="#1b3a88" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="250" cy="255" r="3.5" fill="#1b3a88"/>

    <!-- Flame on Top of Torch/Pen -->
    <path d="
      M 250,172
      C 242,185 240,195 242,205
      C 244,213 247,216 250,218
      C 253,216 256,213 258,205
      C 260,195 258,185 250,172 Z
    " fill="url(#flameGrad)" stroke="#b71c1c" stroke-width="1.5"/>
    <!-- Inner Flame Tongue -->
    <path d="
      M 250,182
      C 246,190 245,198 247,204
      C 248,207 249,209 250,210
      C 251,209 252,207 253,204
      C 255,198 254,190 250,182 Z
    " fill="#fff176" opacity="0.85"/>

    <!-- Lower Pen Nib touching the book -->
    <path d="M 243,295 L 257,295 L 253,355 L 250,366 L 247,355 Z" fill="url(#goldGrad)" stroke="#8a5200" stroke-width="1.5"/>
    <line x1="250" y1="298" x2="250" y2="352" stroke="#162f75" stroke-width="2"/>
    <circle cx="250" cy="335" r="2.5" fill="#162f75"/>
  </g>

  <!-- Open Book at Bottom of Pen -->
  <g transform="translate(250, 372)">
    <!-- Book Pages Terracotta / Orange / Gold -->
    <!-- Left Pages -->
    <path d="M 0,-8 C -25,-18 -60,-16 -95,-4 C -85,12 -50,6 0,16 Z" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
    <path d="M 0,-3 C -25,-12 -58,-10 -90,2 C -80,16 -48,10 0,18 Z" fill="#fdba74" stroke="#ea580c" stroke-width="1"/>
    <!-- Right Pages -->
    <path d="M 0,-8 C 25,-18 60,-16 95,-4 C 85,12 50,6 0,16 Z" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
    <path d="M 0,-3 C 25,-12 58,-10 90,2 C 80,16 48,10 0,18 Z" fill="#fdba74" stroke="#ea580c" stroke-width="1"/>
    <!-- Book Spine -->
    <line x1="0" y1="-9" x2="0" y2="18" stroke="#9a3412" stroke-width="2"/>
  </g>

  <!-- Bottom Golden Ribbon Banner -->
  <g>
    <!-- Ribbon Left Fold -->
    <path d="M 75,340 L 115,365 L 115,410 L 75,385 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <!-- Ribbon Right Fold -->
    <path d="M 425,340 L 385,365 L 385,410 L 425,385 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>

    <!-- Main Curved Banner -->
    <path d="
      M 90,332
      C 160,395 340,395 410,332
      L 426,380
      C 346,450 154,450 74,380 Z
    " fill="url(#goldGrad)" stroke="#92400e" stroke-width="3" filter="url(#glow)"/>

    <!-- Banner Inner Trim Lines -->
    <path d="
      M 96,340
      C 164,398 336,398 404,340
    " fill="none" stroke="#d97706" stroke-width="1.5"/>
    <path d="
      M 82,374
      C 158,442 342,442 418,374
    " fill="none" stroke="#d97706" stroke-width="1.5"/>

    <!-- Text: ABHI PRAYA WIDYA SAKANTI on Banner -->
    <text font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="18" fill="#11255e" letter-spacing="1.5">
      <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
        ABHI PRAYA WIDYA SAKANTI
      </textPath>
    </text>
  </g>
</svg>